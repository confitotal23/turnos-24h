<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Turnos 24h</title>

  <!-- CONFIGURACIÓN PWA Y APARIENCIA DE APP NATIVA (APK) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turnos 24h">
  <meta name="theme-color" content="#0f172a">

  <!-- MANIFIESTO PWA COMPLETO PARA ICONO EN PANTALLA DE INICIO (ANDROID Y IOS) -->
  <link rel="manifest" href="data:application/manifest+json;utf8,{
    %22short_name%22:%22Turnos 24h%22,
    %22name%22:%22Gestión de Turnos 24 Horas%22,
    %22icons%22:[{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%230f172a'/><circle cx='256' cy='256' r='200' fill='none' stroke='%233b82f6' stroke-width='24' stroke-dasharray='30 15'/><text x='51%' y='58%' text-anchor='middle' font-family='Arial, sans-serif' font-weight='900' font-size='190' fill='%23ffffff'>24h</text></svg>%22,%22sizes%22:%22512x512%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any maskable%22}],
    %22start_url%22:%22.%22,
    %22background_color%22:%22%230f172a%22,
    %22theme_color%22:%22%230f172a%22,
    %22display%22:%22standalone%22
  }">

  <!-- ICONO OFICIAL CON LOGO 24H -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%230f172a'/><circle cx='256' cy='256' r='200' fill='none' stroke='%233b82f6' stroke-width='24' stroke-dasharray='30 15'/><text x='51%' y='58%' text-anchor='middle' font-family='Arial, sans-serif' font-weight='900' font-size='190' fill='%23ffffff'>24h</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%230f172a'/><circle cx='256' cy='256' r='200' fill='none' stroke='%233b82f6' stroke-width='24' stroke-dasharray='30 15'/><text x='51%' y='58%' text-anchor='middle' font-family='Arial, sans-serif' font-weight='900' font-size='190' fill='%23ffffff'>24h</text></svg>">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsPDF for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <!-- SDKs OFICIALES DE FIREBASE (AUTENTICACIÓN Y FIRESTORE) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // CONFIGURACIÓN DE FIREBASE (MANTÉN TUS CLAVES AQUÍ)
    const firebaseConfig = {

  apiKey: "AIzaSyAGgDMwopsVMHCJvzwzqvwPOVZdZeUXSsI",

  authDomain: "turnos-24h.firebaseapp.com",

  projectId: "turnos-24h",

  storageBucket: "turnos-24h.firebasestorage.app",

  messagingSenderId: "876085873669",

  appId: "1:876085873669:web:dc844cd619b09e1b88606c"

};

    // Inicializar Firebase de forma segura
    let isFirebaseActive = false;
    let db = null;
    let auth = null;

    try {
      if (firebaseConfig.apiKey !== "PEGA_AQUI_TU_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        auth = firebase.auth();
        isFirebaseActive = true;
      }
    } catch (e) {
      console.warn("Error o falta de clave en Firebase:", e);
    }

    // 1. CONFIGURACIÓN DE NOMBRES Y CUENTAS GMAIL REALES
    const USERS = [
      { 
        id: 'usr_admin', 
        name: 'Administrador Principal', 
        email: 'admin.turnos.empresa@gmail.com',
        avatar: 'AD', 
        color: 'bg-slate-900', 
        border: 'border-slate-900', 
        text: 'text-slate-900', 
        lightBg: 'bg-slate-100', 
        isAdmin: true 
      },
      { 
        id: 'usr_1', 
        name: 'Juan Pérez García', 
        email: 'juanperez.trabajo@gmail.com',
        avatar: 'JP', 
        color: 'bg-blue-500', 
        border: 'border-blue-500', 
        text: 'text-blue-600', 
        lightBg: 'bg-blue-50' 
      },
      { 
        id: 'usr_2', 
        name: 'María Gómez Torres', 
        email: 'mariagomez.trabajo@gmail.com',
        avatar: 'MG', 
        color: 'bg-emerald-500', 
        border: 'border-emerald-500', 
        text: 'text-emerald-600', 
        lightBg: 'bg-emerald-50' 
      },
      { 
        id: 'usr_3', 
        name: 'Carlos Rodríguez', 
        email: 'carlosrodriguez.trabajo@gmail.com',
        avatar: 'CR', 
        color: 'bg-amber-500', 
        border: 'border-amber-500', 
        text: 'text-amber-600', 
        lightBg: 'bg-amber-50' 
      },
      { 
        id: 'usr_4', 
        name: 'Ana Martínez Vidal', 
        email: 'anamartinez.trabajo@gmail.com',
        avatar: 'AM', 
        color: 'bg-purple-500', 
        border: 'border-purple-500', 
        text: 'text-purple-600', 
        lightBg: 'bg-purple-50' 
      },
      { 
        id: 'usr_5', 
        name: 'David López Fernández', 
        email: 'davidlopez.trabajo@gmail.com',
        avatar: 'DL', 
        color: 'bg-rose-500', 
        border: 'border-rose-500', 
        text: 'text-rose-600', 
        lightBg: 'bg-rose-50' 
      },
      { 
        id: 'usr_6', 
        name: 'Elena Sánchez Ruiz', 
        email: 'elenasanchez.trabajo@gmail.com',
        avatar: 'ES', 
        color: 'bg-teal-500', 
        border: 'border-teal-500', 
        text: 'text-teal-600', 
        lightBg: 'bg-teal-50' 
      }
    ];

    // Rotación inicial automática entre los 6 trabajadores
    const generateInitialShifts = () => {
      const shiftsMap = {};
      const workers = USERS.filter(u => !u.isAdmin);
      for (let day = 1; day <= 30; day++) {
        const dateStr = `2026-11-${String(day).padStart(2, '0')}`;
        const userIndex = (day - 1) % workers.length;
        shiftsMap[dateStr] = workers[userIndex].id;
      }
      return shiftsMap;
    };

    const INITIAL_SHIFTS = generateInitialShifts();

    const INITIAL_REQUESTS = [
      {
        id: 'req_101',
        requesterId: 'usr_1',
        targetUserId: 'usr_2',
        requesterDate: '2026-11-01',
        targetDate: '2026-11-02',
        status: 'approved',
        createdAt: '2026-10-28T10:00:00Z',
        completedAt: '2026-10-28T11:15:00Z',
        notes: 'Cambio de día por asuntos familiares.'
      }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(USERS[0]);
      const [currentMonth, setCurrentMonth] = useState(new Date(2026, 10, 1));
      const [shifts, setShifts] = useState(INITIAL_SHIFTS);
      const [requests, setRequests] = useState(INITIAL_REQUESTS);
      const [isNotificationsOpen, setIsNotificationsOpen] = useState(false);
      const [selectedDateForSwap, setSelectedDateForSwap] = useState(null);
      const [swapModalOpen, setSwapModalOpen] = useState(false);
      const [adminAssignModalOpen, setAdminAssignModalOpen] = useState(false);
      const [adminSelectedUser, setAdminSelectedUser] = useState('');
      const [targetSwapDate, setTargetSwapDate] = useState('');
      const [swapNote, setSwapNote] = useState('');

      // CONEXIÓN EN TIEMPO REAL CON FIREBASE FIRESTORE
      useEffect(() => {
        if (!isFirebaseActive || !db) return;

        // Escuchar cambios de turnos en directo con snapshot en tiempo real
        const unsubscribeShifts = db.collection('shifts').onSnapshot((snapshot) => {
          const remoteShifts = {};
          snapshot.forEach((doc) => {
            remoteShifts[doc.id] = doc.data().assignedUserId;
          });
          if (Object.keys(remoteShifts).length > 0) {
            setShifts(prev => ({ ...prev, ...remoteShifts }));
          }
        }, (err) => console.error("Error en tiempo real turnos:", err));

        // Escuchar solicitudes de permuta en directo
        const unsubscribeRequests = db.collection('swap_requests').onSnapshot((snapshot) => {
          const remoteRequests = [];
          snapshot.forEach((doc) => {
            remoteRequests.push({ id: doc.id, ...doc.data() });
          });
          setRequests(remoteRequests);
        }, (err) => console.error("Error en tiempo real solicitudes:", err));

        return () => {
          unsubscribeShifts();
          unsubscribeRequests();
        };
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const formatDateLabel = (dateStr) => {
        if (!dateStr) return '';
        const [year, month, day] = dateStr.split('-');
        return `${day}/${month}/${year}`;
      };

      const handleOpenSwapModal = (dateString) => {
        setSelectedDateForSwap(dateString);
        if (currentUser.isAdmin) {
          setAdminSelectedUser(shifts[dateString] || USERS[1].id);
          setAdminAssignModalOpen(true);
        } else {
          const assigned = shifts[dateString];
          if (assigned !== currentUser.id) {
            alert("Solo puedes solicitar permutas en tus días de servicio asignados.");
            return;
          }
          setTargetSwapDate('');
          setSwapNote('');
          setSwapModalOpen(true);
        }
      };

      const handleAdminDirectAssign = async (e) => {
        e.preventDefault();
        if (!selectedDateForSwap || !adminSelectedUser) return;

        setShifts(prev => ({
          ...prev,
          [selectedDateForSwap]: adminSelectedUser
        }));

        if (isFirebaseActive && db) {
          try {
            await db.collection('shifts').doc(selectedDateForSwap).set({
              assignedUserId: adminSelectedUser,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          } catch (err) {
            console.error("Error guardando turno en Firebase:", err);
          }
        }

        const adminLog = {
          id: `req_${Date.now()}`,
          requesterId: 'usr_admin',
          targetUserId: adminSelectedUser,
          requesterDate: selectedDateForSwap,
          targetDate: selectedDateForSwap,
          status: 'approved',
          createdAt: new Date().toISOString(),
          completedAt: new Date().toISOString(),
          notes: `Reasignación directa por Administrador.`
        };

        setRequests(prev => [adminLog, ...prev]);

        if (isFirebaseActive && db) {
          try {
            await db.collection('swap_requests').doc(adminLog.id).set(adminLog);
          } catch (err) {
            console.error("Error guardando solicitud en Firebase:", err);
          }
        }

        setAdminAssignModalOpen(false);
      };

      const handleCreateSwapRequest = async (e) => {
        e.preventDefault();
        if (!targetSwapDate) return;

        const targetUserId = shifts[targetSwapDate];
        if (targetUserId === currentUser.id) {
          alert("No puedes intercambiar turnos contigo mismo.");
          return;
        }

        const newReq = {
          id: `req_${Date.now()}`,
          requesterId: currentUser.id,
          targetUserId: targetUserId,
          requesterDate: selectedDateForSwap,
          targetDate: targetSwapDate,
          status: 'pending',
          createdAt: new Date().toISOString(),
          notes: swapNote
        };

        setRequests(prev => [newReq, ...prev]);

        if (isFirebaseActive && db) {
          try {
            await db.collection('swap_requests').doc(newReq.id).set(newReq);
          } catch (err) {
            console.error("Error enviando permuta a Firebase:", err);
          }
        }

        setSwapModalOpen(false);
      };

      const handleRespondRequest = async (requestId, isApproved) => {
        const req = requests.find(r => r.id === requestId);
        if (!req) return;

        const nowStr = new Date().toISOString();
        const newStatus = isApproved ? 'approved' : 'rejected';

        if (isApproved) {
          const userA = req.requesterId;
          const userB = req.targetUserId;
          const dateA = req.requesterDate;
          const dateB = req.targetDate;

          setShifts(prev => ({
            ...prev,
            [dateA]: userB,
            [dateB]: userA
          }));

          if (isFirebaseActive && db) {
            try {
              await db.collection('shifts').doc(dateA).set({ assignedUserId: userB });
              await db.collection('shifts').doc(dateB).set({ assignedUserId: userA });
            } catch (err) {
              console.error("Error actualizando turnos en Firebase:", err);
            }
          }
        }

        setRequests(prev => prev.map(r => r.id === requestId ? { ...r, status: newStatus, completedAt: nowStr } : r));

        if (isFirebaseActive && db) {
          try {
            await db.collection('swap_requests').doc(requestId).update({
              status: newStatus,
              completedAt: nowStr
            });
          } catch (err) {
            console.error("Error actualizando estado en Firebase:", err);
          }
        }
      };

      const getDaysInMonth = () => {
        const days = [];
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const firstDayIndex = new Date(year, month, 1).getDay();
        const paddingDays = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

        for (let i = 0; i < paddingDays; i++) {
          days.push(null);
        }

        for (let day = 1; day <= totalDays; day++) {
          const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          days.push({
            dayNumber: day,
            dateString: dateString,
            assignedUserId: shifts[dateString] || null
          });
        }

        return days;
      };

      const userStats = USERS.reduce((acc, user) => {
        const totalDays = Object.values(shifts).filter(userId => userId === user.id).length;
        acc[user.id] = {
          days: totalDays,
          hours: totalDays * 24
        };
        return acc;
      }, {});

      const currentMonthName = currentMonth.toLocaleString('es-ES', { month: 'long', year: 'numeric' });

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans">
          {/* CABECERA */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-blue-600 rounded-lg text-white shadow-md">
                  <i data-lucide="calendar" className="w-6 h-6"></i>
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight text-slate-900">GestorTurnos 24h</h1>
                  <p className="text-xs text-slate-500">Sistema en Tiempo Real con Firebase</p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <div className="flex items-center bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                  <span className="text-xs text-slate-500 font-medium px-2 hidden md:inline">Usuario:</span>
                  <select 
                    value={currentUser.id}
                    onChange={(e) => {
                      const selected = USERS.find(u => u.id === e.target.value);
                      if (selected) setCurrentUser(selected);
                    }}
                    className="bg-white text-xs font-semibold text-slate-700 py-1 px-2.5 rounded-lg border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
                  >
                    {USERS.map(user => (
                      <option key={user.id} value={user.id}>
                        {user.name}
                      </option>
                    ))}
                  </select>
                </div>
              </div>
            </div>
          </header>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
            {/* RESUMEN DE EQUIPO */}
            <div className="bg-white p-5 rounded-2xl shadow-xs border border-slate-200">
              <h2 className="text-sm font-bold text-slate-800 mb-3">Equipo y Horas Acumuladas</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                {USERS.map(user => {
                  const stats = userStats[user.id] || { days: 0, hours: 0 };
                  return (
                    <div key={user.id} className={`flex items-center justify-between p-3 rounded-xl border ${user.lightBg} ${user.border}`}>
                      <div className="flex items-center gap-3">
                        <div className={`w-8 h-8 rounded-full ${user.color} text-white flex items-center justify-center font-bold text-xs`}>
                          {user.avatar}
                        </div>
                        <div>
                          <div className="font-bold text-xs text-slate-800">{user.name}</div>
                          {user.isAdmin ? (
                            <span className="text-[10px] text-slate-500 font-semibold">Superusuario</span>
                          ) : (
                            <span className="text-[10px] text-slate-500">{stats.days} días / {stats.hours}h tot.</span>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* CALENDARIO */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="p-4 sm:p-6 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
                <h2 className="text-xl font-bold text-slate-800 capitalize">{currentMonthName}</h2>
                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1))}
                    className="p-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600"
                  >
                    <i data-lucide="chevron-left" className="w-5 h-5"></i>
                  </button>
                  <button 
                    onClick={() => setCurrentMonth(new Date(2026, 10, 1))}
                    className="px-3 py-1.5 border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 text-xs font-semibold rounded-lg"
                  >
                    Hoy
                  </button>
                  <button 
                    onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1))}
                    className="p-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600"
                  >
                    <i data-lucide="chevron-right" className="w-5 h-5"></i>
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-7 border-b border-slate-200 bg-slate-100 text-center text-xs font-bold text-slate-600 py-2.5">
                <div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div><div>SÁB</div><div>DOM</div>
              </div>

              <div className="grid grid-cols-7 divide-x divide-y divide-slate-100 bg-slate-200/40">
                {getDaysInMonth().map((dayData, index) => {
                  if (!dayData) {
                    return <div key={`empty-${index}`} className="bg-slate-50/50 min-h-[100px]" />;
                  }

                  const assignedUser = USERS.find(u => u.id === dayData.assignedUserId);
                  const isUserShift = dayData.assignedUserId === currentUser.id;

                  return (
                    <div key={dayData.dateString} className="min-h-[100px] bg-white p-2 flex flex-col justify-between">
                      <div className="flex justify-between items-start">
                        <span className={`text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center ${isUserShift ? 'bg-blue-600 text-white' : 'text-slate-700'}`}>
                          {dayData.dayNumber}
                        </span>
                      </div>

                      {assignedUser ? (
                        <div className={`mt-2 p-2 rounded-xl border ${assignedUser.lightBg} ${assignedUser.border}`}>
                          <div className="text-xs font-bold truncate">{assignedUser.name}</div>
                          <div className="text-[10px] text-slate-500">Servicio 24h</div>
                        </div>
                      ) : (
                        <div className="text-[11px] text-slate-400 italic">Sin asignación</div>
                      )}

                      {(isUserShift || currentUser.isAdmin) && (
                        <button 
                          onClick={() => handleOpenSwapModal(dayData.dateString)}
                          className="mt-2 w-full py-1 px-2 rounded-lg text-[11px] font-semibold bg-blue-600 hover:bg-blue-700 text-white"
                        >
                          {currentUser.isAdmin ? 'Reasignar (Admin)' : 'Cambiar turno'}
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
