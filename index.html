<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Turnos 24h</title>

  <!-- CONFIGURACIÓN PWA Y APARIENCIA DE APP NATIVA (APK) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turnos 24h">
  <meta name="theme-color" content="#0f172a">

  <!-- MANIFIESTO PWA COMPLETO PARA ICONO EN PANTALLA DE INICIO (ANDROID Y IOS) -->
  <link rel="manifest" href="data:application/manifest+json;utf8,{
    %22short_name%22:%22Turnos 24h%22,
    %22name%22:%22Gestión de Turnos 24 Horas%22,
    %22icons%22:[{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%230f172a'/><circle cx='256' cy='256' r='200' fill='none' stroke='%233b82f6' stroke-width='24' stroke-dasharray='30 15'/><text x='51%' y='58%' text-anchor='middle' font-family='Arial, sans-serif' font-weight='900' font-size='190' fill='%23ffffff'>24h</text></svg>%22,%22sizes%22:%22512x512%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any maskable%22}],
    %22start_url%22:%22.%22,
    %22background_color%22:%22%230f172a%22,
    %22theme_color%22:%22%230f172a%22,
    %22display%22:%22standalone%22
  }">

  <!-- ICONO OFICIAL CON LOGO 24H -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%230f172a'/><circle cx='256' cy='256' r='200' fill='none' stroke='%233b82f6' stroke-width='24' stroke-dasharray='30 15'/><text x='51%' y='58%' text-anchor='middle' font-family='Arial, sans-serif' font-weight='900' font-size='190' fill='%23ffffff'>24h</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%230f172a'/><circle cx='256' cy='256' r='200' fill='none' stroke='%233b82f6' stroke-width='24' stroke-dasharray='30 15'/><text x='51%' y='58%' text-anchor='middle' font-family='Arial, sans-serif' font-weight='900' font-size='190' fill='%23ffffff'>24h</text></svg>">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsPDF for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 1. CONFIGURACIÓN DE NOMBRES Y CUENTAS GMAIL REALES (CORREOS OCULTOS EN INTERFAZ)
    const USERS = [
      { 
        id: 'usr_admin', 
        name: 'Administrador Principal', 
        email: 'admin.turnos.empresa@gmail.com',
        avatar: 'AD', 
        color: 'bg-slate-900', 
        border: 'border-slate-900', 
        text: 'text-slate-900', 
        lightBg: 'bg-slate-100', 
        isAdmin: true 
      },
      { 
        id: 'usr_1', 
        name: 'Juan Pérez García', 
        email: 'juanperez.trabajo@gmail.com',
        avatar: 'JP', 
        color: 'bg-blue-500', 
        border: 'border-blue-500', 
        text: 'text-blue-600', 
        lightBg: 'bg-blue-50' 
      },
      { 
        id: 'usr_2', 
        name: 'María Gómez Torres', 
        email: 'mariagomez.trabajo@gmail.com',
        avatar: 'MG', 
        color: 'bg-emerald-500', 
        border: 'border-emerald-500', 
        text: 'text-emerald-600', 
        lightBg: 'bg-emerald-50' 
      },
      { 
        id: 'usr_3', 
        name: 'Carlos Rodríguez', 
        email: 'carlosrodriguez.trabajo@gmail.com',
        avatar: 'CR', 
        color: 'bg-amber-500', 
        border: 'border-amber-500', 
        text: 'text-amber-600', 
        lightBg: 'bg-amber-50' 
      },
      { 
        id: 'usr_4', 
        name: 'Ana Martínez Vidal', 
        email: 'anamartinez.trabajo@gmail.com',
        avatar: 'AM', 
        color: 'bg-purple-500', 
        border: 'border-purple-500', 
        text: 'text-purple-600', 
        lightBg: 'bg-purple-50' 
      },
      { 
        id: 'usr_5', 
        name: 'David López Fernández', 
        email: 'davidlopez.trabajo@gmail.com',
        avatar: 'DL', 
        color: 'bg-rose-500', 
        border: 'border-rose-500', 
        text: 'text-rose-600', 
        lightBg: 'bg-rose-50' 
      },
      { 
        id: 'usr_6', 
        name: 'Elena Sánchez Ruiz', 
        email: 'elenasanchez.trabajo@gmail.com',
        avatar: 'ES', 
        color: 'bg-teal-500', 
        border: 'border-teal-500', 
        text: 'text-teal-600', 
        lightBg: 'bg-teal-50' 
      }
    ];

    // Rotación inicial automática entre los 6 trabajadores
    const generateInitialShifts = () => {
      const shiftsMap = {};
      const workers = USERS.filter(u => !u.isAdmin);
      for (let day = 1; day <= 30; day++) {
        const dateStr = `2026-11-${String(day).padStart(2, '0')}`;
        const userIndex = (day - 1) % workers.length;
        shiftsMap[dateStr] = workers[userIndex].id;
      }
      return shiftsMap;
    };

    const INITIAL_SHIFTS = generateInitialShifts();

    const INITIAL_REQUESTS = [
      {
        id: 'req_101',
        requesterId: 'usr_1',
        targetUserId: 'usr_2',
        requesterDate: '2026-11-01',
        targetDate: '2026-11-02',
        status: 'approved',
        createdAt: '2026-10-28T10:00:00Z',
        completedAt: '2026-10-28T11:15:00Z',
        notes: 'Cambio de día por asuntos familiares.'
      }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(USERS[0]);
      const [currentMonth, setCurrentMonth] = useState(new Date(2026, 10, 1));
      const [shifts, setShifts] = useState(INITIAL_SHIFTS);
      const [requests, setRequests] = useState(INITIAL_REQUESTS);
      const [isNotificationsOpen, setIsNotificationsOpen] = useState(false);
      const [selectedDateForSwap, setSelectedDateForSwap] = useState(null);
      const [swapModalOpen, setSwapModalOpen] = useState(false);
      const [adminAssignModalOpen, setAdminAssignModalOpen] = useState(false);
      const [adminSelectedUser, setAdminSelectedUser] = useState('');
      const [targetSwapDate, setTargetSwapDate] = useState('');
      const [swapNote, setSwapNote] = useState('');
      const [historyFilterMonth, setHistoryFilterMonth] = useState('2026-11');

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const formatDateLabel = (dateStr) => {
        if (!dateStr) return '';
        const [year, month, day] = dateStr.split('-');
        return `${day}/${month}/${year}`;
      };

      // EXPORTAR A EXCEL / CSV
      const handleExportCSV = () => {
        const monthName = currentMonth.toLocaleString('es-ES', { month: 'long', year: 'numeric' });
        let csvContent = "data:text/csv;charset=utf-8,Fecha,Dia,Persona Asignada,Horas Servicio\n";

        const days = getDaysInMonth();
        days.forEach(d => {
          if (d) {
            const user = USERS.find(u => u.id === d.assignedUserId);
            csvContent += `${d.dateString},${d.dayNumber},"${user ? user.name : 'Sin asignar'}",24h\n`;
          }
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Cuadrante_Turnos_${currentMonth.getFullYear()}_${currentMonth.getMonth()+1}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // EXPORTAR A PDF
      const handleExportPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const monthName = currentMonth.toLocaleString('es-ES', { month: 'long', year: 'numeric' });
        
        doc.setFontSize(16);
        doc.setTextColor(15, 23, 42);
        doc.text(`Cuadrante de Turnos 24h - ${monthName.toUpperCase()}`, 14, 18);

        doc.setFontSize(10);
        doc.setTextColor(100, 116, 139);
        doc.text("Resumen mensual de cuadrante de guardia e intercambios", 14, 25);

        // Tabla de estadísticas acumuladas
        const statsRows = USERS.filter(u => !u.isAdmin).map(user => {
          const stats = userStats[user.id] || { days: 0, hours: 0 };
          return [user.name, `${stats.days} días`, `${stats.hours} horas`];
        });

        doc.autoTable({
          startY: 30,
          head: [['Trabajador', 'Días Asignados', 'Horas Acumuladas']],
          body: statsRows,
          theme: 'striped',
          headStyles: { fillColor: [30, 41, 59] },
          styles: { fontSize: 9 }
        });

        // Tabla de cuadrante diario
        const days = getDaysInMonth().filter(Boolean);
        const scheduleRows = days.map(d => {
          const user = USERS.find(u => u.id === d.assignedUserId);
          return [formatDateLabel(d.dateString), d.dayNumber, user ? user.name : 'Sin asignar', '24 Horas'];
        });

        doc.autoTable({
          startY: doc.lastAutoTable.finalY + 10,
          head: [['Fecha', 'Día', 'Empleado Asignado', 'Duración Turno']],
          body: scheduleRows,
          theme: 'grid',
          headStyles: { fillColor: [37, 99, 235] },
          styles: { fontSize: 8 }
        });

        doc.save(`Cuadrante_Turnos_${currentMonth.getFullYear()}_${currentMonth.getMonth()+1}.pdf`);
      };

      const handleOpenSwapModal = (dateString) => {
        setSelectedDateForSwap(dateString);
        if (currentUser.isAdmin) {
          setAdminSelectedUser(shifts[dateString] || USERS[1].id);
          setAdminAssignModalOpen(true);
        } else {
          const assigned = shifts[dateString];
          if (assigned !== currentUser.id) {
            alert("Solo puedes solicitar permutas en tus días de servicio asignados.");
            return;
          }
          setTargetSwapDate('');
          setSwapNote('');
          setSwapModalOpen(true);
        }
      };

      const handleAdminDirectAssign = (e) => {
        e.preventDefault();
        if (!selectedDateForSwap || !adminSelectedUser) return;
        
        const prevUser = USERS.find(u => u.id === shifts[selectedDateForSwap]);
        const newUser = USERS.find(u => u.id === adminSelectedUser);

        setShifts(prev => ({
          ...prev,
          [selectedDateForSwap]: adminSelectedUser
        }));

        // Registrar en historial como cambio por administración
        const adminLog = {
          id: `req_${Date.now()}`,
          requesterId: 'usr_admin',
          targetUserId: adminSelectedUser,
          requesterDate: selectedDateForSwap,
          targetDate: selectedDateForSwap,
          status: 'approved',
          createdAt: new Date().toISOString(),
          completedAt: new Date().toISOString(),
          notes: `Reasignación directa realizada por Administrador (Anterior: ${prevUser?.name || 'Libre'}).`
        };

        setRequests(prev => [adminLog, ...prev]);
        setAdminAssignModalOpen(false);
      };

      const handleCreateSwapRequest = (e) => {
        e.preventDefault();
        if (!targetSwapDate) return;

        const targetUserId = shifts[targetSwapDate];
        if (targetUserId === currentUser.id) {
          alert("No puedes intercambiar turnos contigo mismo.");
          return;
        }

        const newReq = {
          id: `req_${Date.now()}`,
          requesterId: currentUser.id,
          targetUserId: targetUserId,
          requesterDate: selectedDateForSwap,
          targetDate: targetSwapDate,
          status: 'pending',
          createdAt: new Date().toISOString(),
          notes: swapNote
        };

        setRequests(prev => [newReq, ...prev]);
        setSwapModalOpen(false);
      };

      const handleRespondRequest = (requestId, isApproved) => {
        const req = requests.find(r => r.id === requestId);
        if (!req) return;

        const nowStr = new Date().toISOString();

        if (isApproved) {
          setShifts(prev => {
            const updated = { ...prev };
            const userA = req.requesterId;
            const userB = req.targetUserId;
            const dateA = req.requesterDate;
            const dateB = req.targetDate;
            updated[dateA] = userB;
            updated[dateB] = userA;
            return updated;
          });
          setRequests(prev => prev.map(r => r.id === requestId ? { ...r, status: 'approved', completedAt: nowStr } : r));
        } else {
          setRequests(prev => prev.map(r => r.id === requestId ? { ...r, status: 'rejected', completedAt: nowStr } : r));
        }
      };

      const currentMonthName = currentMonth.toLocaleString('es-ES', { month: 'long', year: 'numeric' });

      const getDaysInMonth = () => {
        const days = [];
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const firstDayIndex = new Date(year, month, 1).getDay();
        const paddingDays = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

        for (let i = 0; i < paddingDays; i++) {
          days.push(null);
        }

        for (let day = 1; day <= totalDays; day++) {
          const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          days.push({
            dayNumber: day,
            dateString: dateString,
            assignedUserId: shifts[dateString] || null
          });
        }
        return days;
      };

      const userStats = USERS.reduce((acc, user) => {
        const totalDays = Object.values(shifts).filter(userId => userId === user.id).length;
        acc[user.id] = { days: totalDays, hours: totalDays * 24 };
        return acc;
      }, {});

      const pendingReceived = requests.filter(r => r.targetUserId === currentUser.id && r.status === 'pending');

      // Filtrado para el Historial de Cambios por Mes
      const filteredHistory = requests.filter(req => {
        const dateToCheck = req.completedAt || req.createdAt;
        return dateToCheck.startsWith(historyFilterMonth);
      });

      return (
        <div className="min-h-screen flex flex-col">
          {/* CABECERA */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-blue-600 rounded-lg text-white">
                  <i data-lucide="calendar" className="w-6 h-6"></i>
                </div>
                <div>
                  <h1 className="font-bold text-lg text-slate-900 leading-tight">Turnos 24 Horas</h1>
                  <p className="text-xs text-slate-500">Gestión de Cuadrante y Notificaciones de Permuta</p>
                </div>
              </div>

              <div className="flex items-center space-x-4">
                {/* SELECTOR DE USUARIO */}
                <div className="flex items-center bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                  <span className="text-xs text-slate-500 font-medium px-2 hidden md:inline">Usuario activo:</span>
                  <select 
                    value={currentUser.id}
                    onChange={(e) => setCurrentUser(USERS.find(u => u.id === e.target.value))}
                    className="bg-white text-xs font-semibold text-slate-700 py-1 px-2.5 rounded-lg border border-slate-200 shadow-sm focus:outline-none cursor-pointer"
                  >
                    {USERS.map(user => (
                      <option key={user.id} value={user.id}>
                        {user.name} {user.isAdmin ? '(Administrador)' : ''}
                      </option>
                    ))}
                  </select>
                </div>

                {/* NOTIFICACIONES CAMPANA */}
                <div className="relative">
                  <button 
                    onClick={() => setIsNotificationsOpen(!isNotificationsOpen)}
                    className="p-2 text-slate-600 hover:bg-slate-100 rounded-full relative"
                  >
                    <i data-lucide="bell" className="w-5 h-5"></i>
                    {pendingReceived.length > 0 && (
                      <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></span>
                    )}
                  </button>

                  {isNotificationsOpen && (
                    <div className="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-3 space-y-2">
                      <div className="flex justify-between items-center border-b pb-2">
                        <span className="text-xs font-bold text-slate-800">Alertas de Permuta</span>
                        <button onClick={() => setIsNotificationsOpen(false)} className="text-xs text-slate-400">Cerrar</button>
                      </div>

                      {pendingReceived.length === 0 ? (
                        <p className="text-xs text-slate-400 text-center py-4">No tienes solicitudes pendientes.</p>
                      ) : (
                        pendingReceived.map(req => {
                          const requester = USERS.find(u => u.id === req.requesterId);
                          return (
                            <div key={req.id} className="p-2 bg-blue-50 rounded-lg border border-blue-100 text-xs space-y-1.5">
                              <p className="font-semibold text-slate-800">
                                <span className="font-bold">{requester?.name}</span> solicita cambiar su día {formatDateLabel(req.requesterDate)} por tu día {formatDateLabel(req.targetDate)}.
                              </p>
                              <div className="flex gap-2">
                                <button onClick={() => handleRespondRequest(req.id, true)} className="bg-emerald-600 text-white px-2 py-1 rounded font-bold text-[10px]">Aceptar</button>
                                <button onClick={() => handleRespondRequest(req.id, false)} className="bg-slate-200 text-slate-700 px-2 py-1 rounded font-bold text-[10px]">Rechazar</button>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
            {/* LEYENDA TIPO LISTA CON DÍAS Y HORAS */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <h2 className="text-sm font-bold text-slate-800 mb-3">Horas Acumuladas y Conteo de Días (Mes Actual)</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                {USERS.map(user => {
                  const isCurrent = user.id === currentUser.id;
                  const stats = userStats[user.id] || { days: 0, hours: 0 };
                  return (
                    <div key={user.id} className={`flex items-center justify-between p-3 rounded-xl border ${user.lightBg} ${user.border}`}>
                      <div className="flex items-center gap-3">
                        <div className={`w-8 h-8 rounded-full ${user.color} text-white flex items-center justify-center font-bold text-xs`}>
                          {user.avatar}
                        </div>
                        <div className="truncate max-w-[170px]">
                          <p className="font-bold text-xs text-slate-800 truncate">{user.name} {isCurrent && '(Tú)'}</p>
                          <span className="text-[10px] text-slate-500 font-semibold block">{user.isAdmin ? 'Administrador' : 'Turno 24h'}</span>
                        </div>
                      </div>
                      
                      {/* SI ES ADMINISTRADOR SE OCULTAN DÍAS Y HORAS, SE MUESTRA INSIGNIA DE GESTIÓN */}
                      {user.isAdmin ? (
                        <div className="text-right bg-slate-200/60 px-2.5 py-1 rounded-lg border border-slate-300 text-[11px] font-bold text-slate-700">
                          Superusuario
                        </div>
                      ) : (
                        <div className="text-right bg-white px-2.5 py-1 rounded-lg border border-slate-200 text-xs">
                          <div className="font-bold text-slate-800">{stats.days} días</div>
                          <div className="font-semibold text-blue-600">{stats.hours}h tot.</div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* CALENDARIO DE TURNOS CON BOTONES DE EXPORTACIÓN */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="p-4 border-b border-slate-200 flex flex-wrap justify-between items-center bg-slate-50 gap-3">
                <div className="flex items-center gap-3">
                  <div>
                    <h2 className="text-lg font-bold text-slate-800 capitalize">{currentMonthName}</h2>
                    {currentUser.isAdmin && (
                      <span className="bg-slate-900 text-amber-400 text-xs px-3 py-0.5 rounded-full font-bold">
                        Modo Administrador Activado
                      </span>
                    )}
                  </div>
                  {/* CONTROLES NAVEGACIÓN MES Y BOTÓN HOY */}
                  <div className="flex items-center gap-1 border border-slate-200 rounded-lg p-1 bg-white">
                    <button 
                      onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1))}
                      className="p-1 text-slate-600 hover:bg-slate-100 rounded"
                      title="Mes anterior"
                    >
                      <i data-lucide="chevron-left" className="w-4 h-4"></i>
                    </button>
                    <button 
                      onClick={() => setCurrentMonth(new Date(2026, 10, 1))}
                      className="px-2.5 py-0.5 text-xs font-semibold text-slate-700 hover:bg-slate-100 rounded"
                    >
                      Hoy
                    </button>
                    <button 
                      onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1))}
                      className="p-1 text-slate-600 hover:bg-slate-100 rounded"
                      title="Mes siguiente"
                    >
                      <i data-lucide="chevron-right" className="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

                {/* BOTONES EXPORTAR PDF / EXCEL */}
                <div className="flex items-center space-x-2">
                  <button 
                    onClick={handleExportPDF}
                    className="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition-colors"
                  >
                    <i data-lucide="file-text" className="w-4 h-4"></i>
                    Exportar PDF
                  </button>
                  <button 
                    onClick={handleExportCSV}
                    className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition-colors"
                  >
                    <i data-lucide="download" className="w-4 h-4"></i>
                    Exportar Excel (CSV)
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-7 bg-slate-100 text-center text-xs font-bold text-slate-600 py-2">
                <div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div><div>SÁB</div><div>DOM</div>
              </div>

              <div className="grid grid-cols-7 divide-x divide-y divide-slate-100 bg-slate-200/50">
                {getDaysInMonth().map((dayData, index) => {
                  if (!dayData) return <div key={`empty-${index}`} className="bg-slate-50 min-h-[100px]" />;

                  const assignedUser = USERS.find(u => u.id === dayData.assignedUserId);
                  const isUserShift = dayData.assignedUserId === currentUser.id;

                  return (
                    <div key={dayData.dateString} className="min-h-[110px] bg-white p-2 flex flex-col justify-between">
                      <div className="flex justify-between items-start">
                        <span className={`text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center ${isUserShift ? 'bg-blue-600 text-white' : 'text-slate-700'}`}>
                          {dayData.dayNumber}
                        </span>
                      </div>

                      {assignedUser ? (
                        <div className={`p-2 rounded-xl border ${assignedUser.lightBg} ${assignedUser.border}`}>
                          <p className={`text-xs font-bold ${assignedUser.text}`}>{assignedUser.name}</p>
                          <span className="text-[10px] text-slate-500">24 Horas</span>
                        </div>
                      ) : (
                        <span className="text-xs text-slate-400 italic">Libre</span>
                      )}

                      {(isUserShift || currentUser.isAdmin) && (
                        <button 
                          onClick={() => handleOpenSwapModal(dayData.dateString)}
                          className={`w-full py-1 rounded-lg text-[11px] font-bold mt-1 ${currentUser.isAdmin ? 'bg-slate-900 text-amber-400' : 'bg-blue-600 text-white'}`}
                        >
                          {currentUser.isAdmin ? 'Cambiar (Admin)' : 'Solicitar Permuta'}
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* SECCIÓN HISTORIAL DE CAMBIOS POR MES */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3">
                <div>
                  <h3 className="font-bold text-slate-800 text-base">Historial Mensual de Cambios</h3>
                  <p className="text-xs text-slate-500">Registro completo de permutas aceptadas, rechazadas y modificaciones de administración</p>
                </div>

                <div className="flex items-center space-x-2">
                  <span className="text-xs font-semibold text-slate-600">Filtrar Mes:</span>
                  <input 
                    type="month" 
                    value={historyFilterMonth}
                    onChange={(e) => setHistoryFilterMonth(e.target.value)}
                    className="border border-slate-300 rounded-lg text-xs p-1.5 font-semibold text-slate-700 focus:outline-none"
                  />
                </div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs text-slate-600">
                  <thead className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                    <tr>
                      <th className="py-2.5 px-3">Fecha de Registro</th>
                      <th className="py-2.5 px-3">Solicitante / Emisor</th>
                      <th className="py-2.5 px-3">Día Afectado</th>
                      <th className="py-2.5 px-3">Receptor / Destino</th>
                      <th className="py-2.5 px-3">Día Permutado</th>
                      <th className="py-2.5 px-3">Estado Final</th>
                      <th className="py-2.5 px-3">Notas</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filteredHistory.length === 0 ? (
                      <tr>
                        <td colSpan="7" className="py-6 text-center text-slate-400 italic">
                          No hay registro de cambios o permutas para el mes seleccionado ({historyFilterMonth}).
                        </td>
                      </tr>
                    ) : (
                      filteredHistory.map(log => {
                        const requester = USERS.find(u => u.id === log.requesterId);
                        const target = USERS.find(u => u.id === log.targetUserId);
                        const recordDate = log.completedAt ? formatDateLabel(log.completedAt.split('T')[0]) : formatDateLabel(log.createdAt.split('T')[0]);

                        return (
                          <tr key={log.id} className="hover:bg-slate-50">
                            <td className="py-2.5 px-3 font-semibold text-slate-500">{recordDate}</td>
                            <td className="py-2.5 px-3 font-bold text-slate-800">{requester?.name || 'Administrador'}</td>
                            <td className="py-2.5 px-3 font-bold text-blue-600">{formatDateLabel(log.requesterDate)}</td>
                            <td className="py-2.5 px-3 font-bold text-slate-800">{target?.name}</td>
                            <td className="py-2.5 px-3 font-bold text-blue-600">{formatDateLabel(log.targetDate)}</td>
                            <td className="py-2.5 px-3">
                              {log.status === 'approved' && (
                                <span className="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-md text-[11px]">
                                  Aceptado / Efectuado
                                </span>
                              )}
                              {log.status === 'rejected' && (
                                <span className="bg-red-100 text-red-800 font-bold px-2 py-0.5 rounded-md text-[11px]">
                                  Rechazado
                                </span>
                              )}
                              {log.status === 'pending' && (
                                <span className="bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-md text-[11px]">
                                  Pendiente
                                </span>
                              )}
                            </td>
                            <td className="py-2.5 px-3 text-slate-500 italic max-w-xs truncate">{log.notes || '-'}</td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* MODAL SOLICITUD EMPLEADO */}
          {swapModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <h3 className="font-bold text-slate-800 text-base mb-3">Solicitar Permuta de Día</h3>
                <form onSubmit={handleCreateSwapRequest} className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-500 font-bold block mb-1">Tu día asignado:</label>
                    <input type="text" disabled value={formatDateLabel(selectedDateForSwap)} className="w-full bg-slate-100 p-2 text-xs font-bold rounded-lg" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-500 font-bold block mb-1">Día que deseas a cambio:</label>
                    <select 
                      required 
                      value={targetSwapDate} 
                      onChange={(e) => setTargetSwapDate(e.target.value)}
                      className="w-full p-2 border border-slate-300 rounded-lg text-xs"
                    >
                      <option value="">-- Selecciona fecha del cuadrante --</option>
                      {Object.keys(shifts).map(dateStr => {
                        if (dateStr === selectedDateForSwap) return null;
                        const w = USERS.find(u => u.id === shifts[dateStr]);
                        return <option key={dateStr} value={dateStr}>{formatDateLabel(dateStr)} - Asignado a {w?.name}</option>;
                      })}
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setSwapModalOpen(false)} className="px-3 py-1.5 text-xs font-bold text-slate-500">Cancelar</button>
                    <button type="submit" className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold">Enviar Solicitud</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL CAMBIO DIRECTO ADMINISTRADOR */}
          {adminAssignModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <h3 className="font-bold text-slate-900 text-base mb-2">Reasignación Directa Administrador</h3>
                <p className="text-xs text-slate-500 mb-4">Como administrador, este cambio se aplicará al instante sin aprobación.</p>
                <form onSubmit={handleAdminDirectAssign} className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-500 font-bold block mb-1">Fecha seleccionada:</label>
                    <input type="text" disabled value={formatDateLabel(selectedDateForSwap)} className="w-full bg-slate-100 p-2 text-xs font-bold rounded-lg" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-500 font-bold block mb-1">Asignar a:</label>
                    <select 
                      required 
                      value={adminSelectedUser} 
                      onChange={(e) => setAdminSelectedUser(e.target.value)}
                      className="w-full p-2 border border-slate-300 rounded-lg text-xs font-bold"
                    >
                      {USERS.filter(u => !u.isAdmin).map(u => (
                        <option key={u.id} value={u.id}>{u.name}</option>
                      ))}
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setAdminAssignModalOpen(false)} className="px-3 py-1.5 text-xs font-bold text-slate-500">Cancelar</button>
                    <button type="submit" className="px-3 py-1.5 bg-slate-900 text-amber-400 rounded-lg text-xs font-bold">Cambiar Inmediatamente</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
